<!doctype html>
<html lang="ar" dir="rtl" data-reduced-motion="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a49">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="robots" content="index, follow, max-image-preview:large">

  <meta property="og:url" content="https://fxstrict.github.io/oddy/">
  <meta property="og:image" content="https://fxstrict.github.io/oddy/assets/img/og-image.jpg">

  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "رحلة المعرفة | Knowledge Quest",
    "alternateName": ["رحلة المعرفة", "Knowledge Quest"],
    "description": "لعبة مغامرات تعليمية بثمانية عوالم، عربي وإنجليزي، تعمل بدون إنترنت. عمل الطالبة هدى محمد تحت إشراف الدكتورة فاطمة سعد.",
    "url": "https://fxstrict.github.io/oddy/",
    "image": "https://fxstrict.github.io/oddy/assets/img/og-image.jpg",
    "genre": ["Educational", "Adventure", "Quiz"],
    "inLanguage": ["ar", "en"],
    "playMode": "SinglePlayer",
    "gamePlatform": ["Web browser", "Android"],
    "applicationCategory": "GameApplication",
    "isAccessibleForFree": true,
    "creator": { "@type": "Person", "name": "هدى محمد", "alternateName": "Huda Mohamed", "jobTitle": "طالبة" },
    "contributor": { "@type": "Person", "name": "فاطمة سعد", "alternateName": "Fatima Saad", "honorificPrefix": "الدكتورة", "jobTitle": "مشرفة" }
  }
  </script>
  <noscript><style>#splash{display:none!important}</style></noscript>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preload" as="image" href="assets/img/forest-library.webp">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-scene="menu" data-splash="on">
  <div id="splash" class="splash" role="dialog" aria-modal="true" aria-labelledby="splash-title">
    <div class="splash__box">
      <h1 id="splash-title" class="splash__title" data-i18n="app.title">رحلة المعرفة</h1>
      <div class="splash__icon" aria-hidden="true">
        <img src="assets/icons/icon.svg" alt="" width="168" height="168">
        <span class="splash__shine"></span>
      </div>
      <div class="splash__credit">
        <p class="splash__by" data-i18n="credit.by">عمل الطالبة هدى محمد</p>
        <p class="splash__sup" data-i18n="credit.sup">تحت إشراف الدكتورة فاطمة سعد</p>
      </div>
      <div class="splash__load">
        <div class="splash__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="splash-status"><span id="splash-fill"></span></div>
        <p class="splash__row"><span id="splash-status" data-i18n="splash.loading">جارٍ تحميل رحلتك…</span><b id="splash-pct" dir="ltr">0%</b></p>
        <p id="splash-tip" class="splash__tip"></p>
        <button id="splash-start" class="btn btn--primary btn--big splash__start" type="button" hidden data-i18n="splash.start">اضغط للبدء</button>
      </div>
    </div>
  </div>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطَّ إلى المحتوى</a>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <p class="brand" data-i18n="app.title">رحلة المعرفة</p>
      <div class="topbar__actions">
        <span id="chip-coins" class="chip" role="status">🪙 0</span>
        <button id="btn-lang" class="btn btn--small" type="button" lang="en">English</button>
        <button id="btn-mute" class="btn btn--small btn--icon" type="button" aria-pressed="false">🔊</button>
      </div>
    </header>

    <main id="main" class="stage" tabindex="-1">

      <!-- MENU -->
      <section data-screen="menu" class="screen screen--menu" aria-labelledby="menu-title">
        <div class="panel panel--center">
          <h2 id="menu-title" data-focus-target tabindex="-1" data-i18n="menu.title">القائمة الرئيسية</h2>
          <p id="menu-hello" class="hello" hidden></p>
          <p class="tagline" data-i18n="app.tagline"></p>
          <button id="menu-news" class="btn btn--news" type="button" hidden></button>
          <nav class="menu-list" aria-label="menu">
            <button class="btn btn--primary btn--big" type="button" data-nav="play" data-i18n="menu.play"></button>
            <button class="btn" type="button" data-nav="achievements" data-i18n="menu.achievements"></button>
            <button class="btn" type="button" data-nav="settings" data-i18n="menu.settings"></button>
            <button class="btn" type="button" data-nav="help" data-i18n="menu.help"></button>
            <button id="btn-invite" class="btn btn--invite" type="button" data-i18n="menu.invite"></button>
            <button id="btn-install" class="btn btn--accent" type="button" hidden data-i18n="menu.install"></button>
          </nav>
          <p class="credit"><span data-i18n="credit.by"></span><br><span data-i18n="credit.sup"></span></p>
        </div>
      </section>

      <!-- WORLD MAP -->
      <section data-screen="play" class="screen" aria-labelledby="play-title" hidden>
        <h2 id="play-title" data-focus-target tabindex="-1" data-i18n="play.title"></h2>
        <p class="muted" data-i18n="play.hint"></p>
        <button id="btn-review" class="btn btn--accent" type="button" hidden></button>
        <div id="map" class="map" role="group" aria-labelledby="play-title"></div>
        <ul id="world-list" class="world-list"></ul>
        <button class="btn" type="button" data-nav="menu" data-i18n="a11y.back"></button>
      </section>

      <!-- GAME -->
      <section data-screen="game" class="screen screen--game" aria-labelledby="game-title" hidden>
        <h2 id="game-title" class="sr-only" data-focus-target tabindex="-1"></h2>
        <div class="hud">
          <button id="btn-pause" class="btn btn--small" type="button" data-i18n="game.pause"></button>
          <span id="hud-progress" class="chip"></span>
          <span id="hud-lives" class="chip" role="status"></span>
          <span id="hud-timer" class="chip chip--timer" hidden></span>
        </div>
        <div id="timer-bar" class="timer-bar" hidden><span></span></div>
        <div class="panel panel--question">
          <p id="q-text" class="question"></p>
          <div id="q-options" class="options"></div>
          <p id="q-feedback" class="feedback" role="status"></p>
          <p id="q-explain" class="explain" role="status" hidden></p>
          <div class="actions">
            <button id="btn-hint" class="btn btn--small" type="button"></button>
            <button id="btn-q-share" class="btn btn--small" type="button" hidden></button>
            <button id="btn-next" class="btn btn--primary" type="button" hidden></button>
          </div>
        </div>
      </section>

      <!-- ACHIEVEMENTS -->
      <section data-screen="achievements" class="screen" aria-labelledby="ach-title" hidden>
        <h2 id="ach-title" data-focus-target tabindex="-1" data-i18n="ach.title"></h2>
        <p id="ach-count" class="muted"></p>
        <ul id="ach-list" class="ach-list"></ul>
        <button class="btn" type="button" data-nav="menu" data-i18n="a11y.back"></button>
      </section>

      <!-- SETTINGS -->
      <section data-screen="settings" class="screen" aria-labelledby="settings-title" hidden>
        <h2 id="settings-title" data-focus-target tabindex="-1" data-i18n="settings.title"></h2>
        <div class="panel">
          <fieldset class="field">
            <legend data-i18n="settings.profile"></legend>
            <label for="opt-name" data-i18n="settings.name"></label>
            <input id="opt-name" class="input" type="text" maxlength="20" autocomplete="nickname">
            <p id="avatar-label" data-i18n="settings.avatar"></p>
            <div id="avatar-list" class="avatars" role="radiogroup" aria-labelledby="avatar-label"></div>
          </fieldset>

          <fieldset class="field">
            <legend data-i18n="settings.language"></legend>
            <label class="choice"><input type="radio" name="opt-lang" id="opt-lang-ar" value="ar"> <span lang="ar">العربية</span></label>
            <label class="choice"><input type="radio" name="opt-lang" id="opt-lang-en" value="en"> <span lang="en">English</span></label>
          </fieldset>

          <div class="field">
            <label for="opt-age" data-i18n="settings.age"></label>
            <select id="opt-age" class="input">
              <option value="1" data-i18n="age.1"></option>
              <option value="2" data-i18n="age.2"></option>
              <option value="3" data-i18n="age.3"></option>
            </select>
          </div>

          <div class="field">
            <label for="opt-difficulty" data-i18n="settings.difficulty"></label>
            <select id="opt-difficulty" class="input">
              <option value="easy" data-i18n="difficulty.easy"></option>
              <option value="normal" data-i18n="difficulty.normal"></option>
              <option value="challenge" data-i18n="difficulty.challenge"></option>
            </select>
          </div>

          <div class="field">
            <label class="choice"><input type="checkbox" id="opt-sound"> <span data-i18n="settings.soundOn"></span></label>
            <label class="choice"><input type="checkbox" id="opt-motion"> <span data-i18n="settings.reducedMotion"></span></label>
          </div>
          <button id="btn-reset" class="btn btn--danger" type="button" data-i18n="settings.reset"></button>
        </div>
        <button class="btn" type="button" data-nav="menu" data-i18n="a11y.back"></button>
      </section>

      <!-- HELP -->
      <section data-screen="help" class="screen" aria-labelledby="help-title" hidden>
        <h2 id="help-title" data-focus-target tabindex="-1" data-i18n="help.title"></h2>
        <div class="panel">
          <h3 data-i18n="help.storyHeading"></h3>
          <p data-i18n="help.story"></p>
          <h3 data-i18n="help.rulesHeading"></h3>
          <p data-i18n="help.rules"></p>
          <h3 data-i18n="help.controlsHeading"></h3>
          <p data-i18n="help.controls"></p>
          <h3 data-i18n="help.installHeading"></h3>
          <p data-i18n="help.install"></p>
          <button id="btn-intro-replay" class="btn btn--small" type="button" data-i18n="help.replayIntro"></button>
        </div>
        <button class="btn" type="button" data-nav="menu" data-i18n="a11y.back"></button>
      </section>

      <noscript><p data-i18n="noscript">تحتاج هذه اللعبة إلى تفعيل جافاسكربت.</p></noscript>
    </main>
  </div>

  <!-- Dialogs -->
  <dialog id="dlg-world" class="dlg" aria-labelledby="dlg-world-title">
    <h3 id="dlg-world-title"></h3>
    <p id="dlg-world-stars" class="muted"></p>
    <p id="dlg-world-mastery" class="muted"></p>
    <progress id="dlg-world-mastery-bar" class="mastery" max="100" value="0" aria-hidden="true"></progress>
    <p id="dlg-world-story" class="story"></p>
    <div id="dlg-world-levels" class="levels"></div>
    <button class="btn" type="button" data-close data-i18n="a11y.close"></button>
  </dialog>

  <dialog id="dlg-intro" class="dlg dlg--intro" aria-labelledby="intro-title">
    <p class="intro__icon" id="intro-icon" aria-hidden="true"></p>
    <h3 id="intro-title" tabindex="-1"></h3>
    <p id="intro-text"></p>
    <p id="intro-step" class="muted" dir="auto"></p>
    <div class="levels levels--row">
      <button id="intro-skip" class="btn" type="button" data-i18n="intro.skip"></button>
      <button id="intro-next" class="btn btn--primary" type="button"></button>
    </div>
  </dialog>

  <dialog id="dlg-age" class="dlg" aria-labelledby="age-title">
    <h3 id="age-title" tabindex="-1" data-i18n="age.title"></h3>
    <p class="muted" data-i18n="age.desc"></p>
    <div class="levels">
      <button class="btn btn--primary age-btn" type="button" data-age="1"><strong data-i18n="age.1"></strong><span data-i18n="age.1.desc"></span></button>
      <button class="btn btn--primary age-btn" type="button" data-age="2"><strong data-i18n="age.2"></strong><span data-i18n="age.2.desc"></span></button>
      <button class="btn btn--primary age-btn" type="button" data-age="3"><strong data-i18n="age.3"></strong><span data-i18n="age.3.desc"></span></button>
    </div>
  </dialog>

  <dialog id="dlg-pause" class="dlg" aria-labelledby="dlg-pause-title">
    <h3 id="dlg-pause-title" data-i18n="game.pauseTitle"></h3>
    <div class="levels">
      <button id="pause-resume" class="btn btn--primary" type="button" data-i18n="game.resume"></button>
      <button id="pause-restart" class="btn" type="button" data-i18n="game.restart"></button>
      <button id="pause-quit" class="btn" type="button" data-i18n="game.quit"></button>
    </div>
  </dialog>

  <dialog id="dlg-confirm" class="dlg" aria-labelledby="dlg-confirm-text">
    <p id="dlg-confirm-text"></p>
    <div class="levels levels--row">
      <button id="confirm-yes" class="btn btn--danger" type="button" data-i18n="confirm.yes"></button>
      <button id="confirm-no" class="btn" type="button" data-i18n="confirm.no"></button>
    </div>
  </dialog>

  <dialog id="dlg-result" class="dlg" aria-labelledby="result-title">
    <h3 id="result-title"></h3>
    <p id="result-stars" class="stars-big" aria-hidden="true"></p>
    <p id="result-score"></p>
    <p id="result-coins" class="muted"></p>
    <p id="result-vs" class="vs" role="status"></p>
    <p id="result-fact" class="fact" hidden></p>
    <ul id="result-ach" class="result-ach"></ul>
    <div class="levels">
      <button id="result-next" class="btn btn--primary" type="button" hidden data-i18n="result.next"></button>
      <button id="result-share" class="btn btn--invite" type="button" hidden data-i18n="share.level"></button>
      <button id="result-again" class="btn" type="button" data-i18n="result.again"></button>
      <button id="result-map" class="btn" type="button" data-i18n="result.map"></button>
    </div>
  </dialog>

  <dialog id="dlg-update" class="dlg dlg--update" aria-labelledby="update-title">
    <p class="update__icon" aria-hidden="true">🎁</p>
    <h3 id="update-title" data-i18n="update.title"></h3>
    <p id="update-text" data-i18n="update.text"></p>
    <ul id="update-news" class="news" hidden></ul>
    <p id="update-error" class="muted" role="alert" hidden></p>
    <div class="levels levels--row">
      <button id="update-later" class="btn" type="button" data-i18n="update.later"></button>
      <button id="update-now" class="btn btn--primary" type="button" data-i18n="update.now"></button>
    </div>
  </dialog>

  <dialog id="dlg-share" class="dlg" aria-labelledby="share-title">
    <h3 id="share-title" data-i18n="share.title"></h3>
    <textarea id="share-text" class="input share-text" rows="4" readonly></textarea>
    <div class="levels">
      <a id="share-wa" class="btn btn--primary" href="#" target="_blank" rel="noopener noreferrer" data-i18n="share.whatsapp"></a>
      <a id="share-tg" class="btn" href="#" target="_blank" rel="noopener noreferrer" data-i18n="share.telegram"></a>
      <button id="share-copy" class="btn" type="button" data-i18n="share.copy"></button>
      <button class="btn" type="button" data-close data-i18n="a11y.close"></button>
    </div>
  </dialog>

  <dialog id="dlg-challenge" class="dlg" aria-labelledby="ch-title">
    <p class="update__icon" aria-hidden="true">⚔️</p>
    <h3 id="ch-title"></h3>
    <p id="ch-text" class="question question--dlg"></p>
    <div id="ch-options" class="options"></div>
    <p id="ch-result" class="feedback" role="status"></p>
    <div class="levels">
      <button id="ch-accept" class="btn btn--primary" type="button" hidden data-i18n="challenge.accept"></button>
    </div>
    <div id="ch-actions" class="levels" hidden>
      <button id="ch-play" class="btn btn--primary" type="button" data-i18n="challenge.play"></button>
      <button id="ch-share" class="btn" type="button" data-i18n="challenge.pass"></button>
    </div>
    <button id="ch-close" class="btn" type="button" data-i18n="a11y.close"></button>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
