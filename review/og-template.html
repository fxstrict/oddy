<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<!-- Source of assets/img/og-image.jpg (1200x630). Render with Playwright/Chromium, then save as JPEG (quality ~85, < 300 KB). -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"DejaVu Sans",sans-serif;color:#fff}
  .bg{position:absolute;inset:0;background:url(../assets/img/forest-library.webp) center/cover}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,16,14,.78),rgba(6,16,14,.45) 60%,rgba(6,16,14,.7))}
  .icon{position:absolute;left:70px;top:135px;width:360px;height:360px;border-radius:72px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .col{position:absolute;right:70px;top:70px;width:690px;text-align:right}
  h1{margin:0;font-size:82px;color:#f4b942;line-height:1.15;text-shadow:0 4px 12px rgba(0,0,0,.6)}
  .en{font-size:40px;font-weight:700;margin:2px 0 14px;direction:ltr;text-align:right}
  .tag{font-size:27px;margin:0 0 20px;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-start}
  .chip{border:2px solid #f4b942;border-radius:30px;padding:7px 20px;font-size:24px;background:rgba(6,16,14,.55);font-weight:700}
  .credit{position:absolute;right:70px;bottom:40px;width:620px;padding:16px 28px;border:2px solid #f4b942;border-radius:22px;background:rgba(3,12,10,.85);text-align:right}
  .credit b{display:block;font-size:34px}
  .credit span{display:block;font-size:28px;color:#f4b942;font-weight:700;margin-top:4px}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<img class="icon" src="../assets/icons/icon.svg" alt="">
<div class="col">
  <h1>رحلة المعرفة</h1>
  <div class="en">Knowledge Quest</div>
  <p class="tag">لعبة مغامرات تعليمية في عوالم المعرفة</p>
  <div class="chips"><span class="chip">★ ٨ عوالم</span><span class="chip">★ بدون إنترنت</span><span class="chip">★ عربي وEnglish</span><span class="chip">★ نجوم وإنجازات</span></div>
</div>
<div class="credit"><b>عمل الطالبة هدى محمد</b><span>تحت إشراف الدكتورة فاطمة سعد</span></div>
</body></html>
