name: Build Android APK (debug)
# Manual run: Actions -> "Build Android APK (debug)" -> Run workflow. Download the APK from the run's Artifacts.
# NOTE: not yet run end-to-end (no Android SDK in the authoring environment). Debug APK only; a Play Store release needs signing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run check
      - run: npm run build
        env:
          KQ_SITE_URL: ${{ vars.KQ_SITE_URL }}
      - run: npx cap add android
      # Launcher icon (adaptive) + splash for Android, generated from resources/ (tested locally: 74 files).
      - run: npx --yes @capacitor/assets generate --android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-quest-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
